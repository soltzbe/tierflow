<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A focused, ad-free tier list ranking interface.">
  <title>TierFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="brand">TIER<span>FLOW</span></div>
      </div>

      <form class="import-form" id="importForm">
        <label class="sr-only" for="url">TierMaker template URL</label>
        <input id="url" autocomplete="url" inputmode="url" placeholder="Paste tiermaker.com/create/... link" required>
        <button class="btn primary" type="submit">Import</button>
      </form>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">
      Paste a public TierMaker template link to begin.
    </p>

    <section class="workspace" id="workspace" hidden>
      <div class="heading">
        <div class="heading-copy">
          <h1 id="title">Imported Tier List</h1>
          <a id="source" class="source" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div class="heading-actions">
          <button class="btn subtle" id="undo" type="button">Undo</button>
          <button class="btn subtle" id="shuffle" type="button">Shuffle</button>
          <button class="btn subtle" id="editTiers" type="button">Edit tiers</button>
        </div>
      </div>

      <div class="live-layout">
        <section class="board-wrap" aria-label="Tier list">
          <div class="board" id="board"></div>
        </section>

        <aside class="vote-panel" aria-labelledby="voteHeading">
          <div class="vote-panel-inner">
            <h2 id="voteHeading">SUBMIT VOTE</h2>

            <div class="imagebox">
              <img id="currentImg" alt="Current item">
            </div>

            <div class="item-meta">
              <strong id="currentHeading">Current item</strong>
              <span id="itemIndex" class="muted"></span>
            </div>

            <div class="tier-grid" id="tierButtons" aria-label="Choose a tier"></div>
            <button class="skip-btn" id="skip" type="button">SKIP</button>

            <div class="progress-block">
              <div class="progress-line">
                <span>Progress</span>
                <span id="progress">0 / 0</span>
              </div>
              <div class="progress-track" aria-hidden="true">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>

            <p class="help">
              Keys <kbd>1</kbd>–<kbd>9</kbd> rank · <kbd>Z</kbd> undo · <kbd>S</kbd> skip
            </p>
          </div>
        </aside>
      </div>

      <section class="queue-wrap" aria-label="Remaining items">
        <div class="queue" id="queue"></div>
      </section>
    </section>
  </main>

  <dialog id="tierDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="tierEditorForm">
      <div class="dialog-heading">
        <h2>Edit tiers</h2>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="tierEditor"></div>
      <div class="controls dialog-actions">
        <button class="btn" id="addTier" type="button">+ Add tier</button>
        <button class="btn primary" id="saveTiers" type="button">Done</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
